name: Update Happ Subscription

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download VPN servers
        run: |
          echo "Downloading VPN servers from all sources..."
          
          > all_servers.txt
          
          # Source 1: igareck - white lists
          curl -s "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt" >> all_servers.txt || true
          
          # Source 2: igareck - black lists
          curl -s "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt" >> all_servers.txt || true
          
          # Source 3: ebrasha - VLESS
          curl -s "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/vless.txt" >> all_servers.txt || true
          
          # Source 4: FreeFolksOn - VLESS
          curl -s "https://raw.githubusercontent.com/FreeFolksOn/abc-configs-free-vpn-proxy-list/main/vless.txt" >> all_servers.txt || true
          
          # Source 5: Delta-Kronecker
          curl -s "https://raw.githubusercontent.com/Delta-Kronecker/V2ray-Config/main/vless.txt" >> all_servers.txt || true
          
          # Source 6: MatinGhanbari
          curl -s "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/vless.txt" >> all_servers.txt || true
          
          # Source 7: kort0881
          curl -s "https://raw.githubusercontent.com/kort0881/vpn-vless-configs-russia/main/vless.txt" >> all_servers.txt || true
          
          echo "Filtering and removing duplicates..."
          
          # Keep only valid protocols
          grep -E '^(vless|vmess|trojan|ss|hysteria2|hy2)://' all_servers.txt > filtered.txt || true
          
          # Remove duplicates
          sort -u filtered.txt > unique.txt
          
          # Remove empty lines
          grep -v '^$' unique.txt > subscription.txt
          
          # Count results
          TOTAL=$(wc -l < subscription.txt)
          VLESS=$(grep -c '^vless://' subscription.txt || echo 0)
          VMESS=$(grep -c '^vmess://' subscription.txt || echo 0)
          TROJAN=$(grep -c '^trojan://' subscription.txt || echo 0)
          SS=$(grep -c '^ss://' subscription.txt || echo 0)
          HYSTERIA=$(grep -c '^hysteria2://' subscription.txt || echo 0)
          
          echo "Total servers: $TOTAL"
          echo "VLESS: $VLESS"
          echo "VMess: $VMESS"
          echo "Trojan: $TROJAN"
          echo "Shadowsocks: $SS"
          echo "Hysteria2: $HYSTERIA"
          
          rm -f all_servers.txt filtered.txt unique.txt

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.txt
          git commit -m "Update subscription" || echo "No changes"
          git push
