name: Update Happ Subscription

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download and filter links
        run: |
          # Очищаем файл
          > subscription.txt
          
          echo "📥 Скачиваем источники..."
          
          # Приоритет 1: Проверенные источники (белые списки igareck)
          echo " Приоритет 1: igareck (белые списки)"
          curl -s "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt" | \
            grep -E '^(vless|vmess|trojan|ss|hysteria2|hy2)://' >> priority1.txt || true
          
          # Приоритет 2: Чёрные списки igareck
          echo "🔹 Приоритет 2: igareck (чёрные списки)"
          curl -s "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt" | \
            grep -E '^(vless|vmess|trojan|ss|hysteria2|hy2)://' >> priority2.txt || true
          
          # Приоритет 3: Остальные источники
          echo "🔹 Приоритет 3: ebrasha"
          curl -s "https://raw.githubusercontent.com/ebrasha/free-v2ray-public-list/main/vless.txt" | \
            grep -E '^(vless|vmess|trojan|ss|hysteria2|hy2)://' >> priority3.txt || true
          
          echo "🔹 Приоритет 3: FreeFolksOn"
          curl -s "https://raw.githubusercontent.com/FreeFolksOn/abc-configs-free-vpn-proxy-list/main/vless.txt" | \
            grep -E '^(vless|vmess|trojan|ss|hysteria2|hy2)://' >> priority3.txt || true
          
          # Убираем дубликаты внутри каждого приоритета
          echo "🧹 Убираем дубликаты..."
          sort -u priority1.txt -o priority1.txt
          sort -u priority2.txt -o priority2.txt
          sort -u priority3.txt -o priority3.txt
          
          # Собираем в один файл по приоритету
          echo "📊 Собираем финальный список..."
          cat priority1.txt priority2.txt priority3.txt > subscription.txt
          
          # Финальная проверка на дубли
          sort -u subscription.txt -o temp.txt
          mv temp.txt subscription.txt
          
          # Показываем статистику
          echo ""
          echo "✅ Статистика:"
          echo "   Приоритет 1 (igareck белые): $(wc -l < priority1.txt) серверов"
          echo "   Приоритет 2 (igareck чёрные): $(wc -l < priority2.txt) серверов"
          echo "   Приоритет 3 (остальные): $(wc -l < priority3.txt) серверов"
          echo "   ВСЕГО уникальных: $(wc -l < subscription.txt) серверов"
          
          # Ограничиваем до 200 серверов (топ по приоритету)
          if [ $(wc -l < subscription.txt) -gt 200 ]; then
            head -n 200 subscription.txt > temp.txt
            mv temp.txt subscription.txt
            echo "️  Ограничено до 200 серверов (топ по качеству)"
          fi
          
          # Удаляем временные файлы
          rm -f priority1.txt priority2.txt priority3.txt temp.txt

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.txt
          git commit -m "Update subscription $(date)" || echo "No changes"
          git push
