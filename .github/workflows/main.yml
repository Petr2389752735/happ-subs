name: Update Happ Subscription

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download quality links
        run: |
          echo "📥 Скачиваем только проверенные источники..."
          
          # Только igareck - самые надёжные для РФ
          echo "  igareck (белые списки - для РФ)"
          curl -s "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/Vless-Reality-White-Lists-Rus-Mobile.txt" > temp1.txt
          
          echo "  igareck (чёрные списки - для обхода)"
          curl -s "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt" > temp2.txt
          
          # Объединяем и чистим
          cat temp1.txt temp2.txt | grep -E '^(vless|vmess|trojan|ss|hysteria2|hy2)://' | sort -u > subscription.txt
          
          # Берём только первые 50 (самые свежие = самые рабочие)
          head -n 50 subscription.txt > temp.txt
          mv temp.txt subscription.txt
          
          echo ""
          echo "✅ Готово! Серверов: $(wc -l < subscription.txt)"
          
          rm -f temp1.txt temp2.txt

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.txt
          git commit -m "Update subscription $(date)" || echo "No changes"
          git push
