name: Update Routing Rules

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download routing rules
        run: |
          echo "Downloading rules..."
          
          curl -s -f "https://raw.githubusercontent.com/hydraponique/roscomvpn-routing/main/HAPP/DEFAULT.JSON" > rules.json || true
          
          if [ ! -s rules.json ]; then
            echo "Download failed, creating fallback rules..."
            cat > rules.json << 'EOF'
            {
              "dns": {
                "servers": [
                  {"tag": "remote", "address": "tls://8.8.8.8"},
                  {"tag": "local", "address": "https://dns.yandex.ru/dns-query"}
                ]
              },
              "routing": {
                "rules": [
                  {"type": "field", "ip": ["geoip:private"], "outbound": "direct"},
                  {"type": "field", "geosite": ["category-ru"], "outbound": "direct"},
                  {"type": "field", "geosite": ["youtube", "telegram"], "outbound": "proxy"}
                ]
              }
            }
            EOF
          fi
          
          echo "Done. File size: $(wc -c < rules.json) bytes"

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules.json
          git commit -m "Update rules" || echo "No changes"
          git push
